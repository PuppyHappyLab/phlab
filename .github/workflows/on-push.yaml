name: on-push
run-name: on push to main

on:
  push:
    branches:
      - main

  # run if user manually requests it
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    # skip first run because nothing enabled or setup yet
    if: github.run_number != 1
    uses: ./.github/workflows/update-citations.yaml
    secrets: inherit

  build-site:
    needs: update-citations
    # The first push skips citations. A skipped dependency would otherwise
    # skip this job too, so the site would never be built.
    if: always() && (needs.update-citations.result == 'success' || needs.update-citations.result == 'skipped')
    uses: ./.github/workflows/build-site.yaml
